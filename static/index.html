<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>911</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d5001c'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-weight='800' font-size='15' text-anchor='middle' fill='white'%3E911%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0c0d; --bg2: #141416; --bg3: #1c1c1f; --line: #26262a; --line2: #35353b;
    --text: #ececee; --muted: #8b8b93; --red: #d5001c; --danger: #ff6b7a; --ok: #3dbb7f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  button, input, select { font: inherit; color: inherit; }
  .i { width: 20px; height: 20px; flex-shrink: 0; }

  /* topo */
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; letter-spacing: .12em; color: var(--text); text-decoration: none; }
  .brand::before { content: ""; width: 4px; height: 20px; border-radius: 2px; background: var(--red); }
  .search { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; color: var(--muted); }
  .search:focus-within { border-color: var(--line2); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; }
  .search input::-webkit-search-cancel-button { display: none; }
  kbd { font: 12px ui-monospace, monospace; padding: 1px 6px; border: 1px solid var(--line2); border-radius: 5px; }
  .actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .actions form { display: contents; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--bg3); border-color: var(--line2); }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn.danger { background: #a30016; border-color: #a30016; color: #fff; font-weight: 600; }
  .btn.icon { width: 40px; padding: 0; }
  .btn.small { height: 34px; padding: 0 12px; font-size: 14px; }
  .btn.on { border-color: var(--red); }

  .bar { display: flex; align-items: center; gap: 12px; padding: 20px 24px 10px; }
  #crumbs { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 20px; font-weight: 650; }
  #crumbs a, #crumbs .cur { padding: 2px 6px; border-radius: 6px; color: var(--muted); text-decoration: none; }
  #crumbs a:hover { color: var(--text); background: var(--bg2); }
  #crumbs a:last-of-type, #crumbs .cur { color: var(--text); }
  #crumbs .sep { color: var(--line2); }
  #crumbs .over { outline: 2px solid var(--red); }
  #crumbs .count { margin-left: 8px; color: var(--muted); font-size: 14px; font-weight: 400; }
  #crumbs .push { margin-left: auto; }
  select { height: 34px; padding: 0 8px; background: var(--bg2); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; }

  /* grade de arquivos */
  main { flex: 1; padding: 6px 24px 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  .card { position: relative; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; outline: none; transition: border-color .15s; }
  .card:hover, .card:focus-visible { border-color: var(--line2); }
  .card.over { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
  .thumb { position: relative; aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; color: var(--k); background: color-mix(in srgb, var(--k) 12%, var(--bg3)); }
  .thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumb.has .label { visibility: hidden; }
  .thumb > .i { width: 56px; height: 56px; }
  .label { padding: 5px 10px; border: 1.5px solid currentColor; border-radius: 6px; font-size: 14px; font-weight: 800; letter-spacing: .08em; }
  .play { position: absolute; left: 8px; bottom: 8px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; }
  .play .i { width: 14px; height: 14px; }
  .info { padding: 10px 12px 12px; }
  .name { font-size: 14px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 8px; background: rgba(0, 0, 0, .55); backdrop-filter: blur(6px); color: #fff; cursor: pointer; opacity: 0; }
  .card:hover .more, .card:focus-within .more { opacity: 1; }
  @media (hover: none) { .more { opacity: 1; } }

  .k-dir { --k: #d9a84e; } .k-pdf { --k: #f2555a; } .k-doc { --k: #4c9aff; } .k-sheet { --k: #3dbb7f; }
  .k-slide { --k: #ff8a3d; } .k-zip { --k: #b8977e; } .k-text { --k: #a1a1aa; } .k-audio { --k: #b07cff; }
  .k-video { --k: #ff5fa2; } .k-image { --k: #2ec4b6; } .k-other { --k: #8b8b93; }

  /* lixeira */
  .rows { display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; }
  .tile { display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 8px; color: var(--k); background: color-mix(in srgb, var(--k) 14%, var(--bg3)); font-size: 10px; font-weight: 800; }
  .row .txt { flex: 1; min-width: 0; }

  .empty { padding: 80px 16px; text-align: center; color: var(--muted); }
  .empty .i { width: 44px; height: 44px; }
  .empty b { display: block; margin: 12px 0 4px; color: var(--text); font-size: 17px; }
  #stats { padding: 0 24px 20px; color: var(--muted); font-size: 13px; }

  /* arrastar arquivos pra dentro */
  #drop { position: fixed; inset: 8px; z-index: 20; display: none; place-items: end center; padding-bottom: 32px; pointer-events: none; border: 2px dashed var(--red); border-radius: 16px; background: color-mix(in srgb, var(--red) 6%, transparent); }
  #drop.on { display: grid; }
  #drop div { padding: 12px 18px; border-radius: 999px; background: var(--red); color: #fff; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }

  /* envios */
  #uploads { position: fixed; right: 16px; bottom: 16px; z-index: 15; width: 360px; max-width: calc(100vw - 32px); overflow: hidden; background: var(--bg2); border: 1px solid var(--line2); border-radius: 14px; box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
  .uhead { display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-size: 14px; font-weight: 600; }
  .uhead span { flex: 1; }
  .uhead button, .uitem button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px; display: grid; }
  .uhead button:hover, .uitem button:hover { color: var(--text); }
  .ubar { height: 3px; background: var(--line); }
  .ubar i { display: block; height: 100%; background: var(--red); transition: width .2s; }
  .ulist { max-height: 240px; overflow: auto; padding: 6px 0; }
  .uitem { display: flex; align-items: center; gap: 10px; padding: 5px 14px; font-size: 13px; }
  .uitem .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uitem .s { color: var(--muted); font-variant-numeric: tabular-nums; }
  .uitem.ok .s { color: var(--ok); }
  .uitem.err .s { color: var(--danger); }
  .uitem .i { width: 16px; height: 16px; }
  .umore { padding: 4px 14px 8px; color: var(--muted); font-size: 12px; }
  #uploads.min .ulist, #uploads.min .umore { display: none; }

  /* visualizador */
  #viewer { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: #060607; }
  .vbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .vtitle { flex: 1; min-width: 0; }
  #vname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #vmeta { color: var(--muted); font-size: 13px; }
  .vstage { position: relative; flex: 1; min-height: 0; display: flex; }
  #vbody { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 16px 76px; }
  #vbody img, #vbody video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  #vbody iframe { width: 100%; height: 100%; border: 0; border-radius: 8px; background: #fff; }
  #vbody pre { width: 100%; height: 100%; margin: 0; padding: 16px 20px; overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; font: 13.5px/1.6 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  #vbody audio { width: min(560px, 100%); }
  .fallback { text-align: center; color: var(--muted); }
  .fallback .tile { width: 120px; height: 120px; margin: 0 auto 16px; border-radius: 20px; font-size: 22px; }
  .fallback p { margin: 0 0 16px; }
  .nav { position: absolute; top: 50%; z-index: 1; display: grid; place-items: center; width: 44px; height: 44px; transform: translateY(-50%); border: 1px solid var(--line2); border-radius: 50%; background: rgba(20, 20, 22, .85); cursor: pointer; }
  .nav:hover { border-color: var(--muted); }
  .nav:disabled { display: none; }
  .prev { left: 16px; } .next { right: 16px; }

  /* menu, diálogo, aviso */
  #menu { position: fixed; z-index: 40; min-width: 190px; padding: 6px; background: var(--bg3); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, .5); }
  #menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: none; font-size: 14px; text-align: left; cursor: pointer; }
  #menu button:hover, #menu button:focus-visible { background: var(--line); outline: none; }
  #menu .danger { color: var(--danger); }
  #menu .i { width: 18px; height: 18px; color: var(--muted); }
  #menu .danger .i { color: inherit; }
  #menu hr { margin: 6px 4px; border: 0; border-top: 1px solid var(--line2); }
  dialog { width: min(420px, calc(100vw - 32px)); padding: 22px; background: var(--bg2); color: var(--text); border: 1px solid var(--line2); border-radius: 16px; box-shadow: 0 30px 60px rgba(0, 0, 0, .6); }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h3 { margin: 0 0 6px; font-size: 17px; }
  dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  dialog input { width: 100%; height: 42px; padding: 0 12px; background: var(--bg); border: 1px solid var(--line2); border-radius: 10px; outline: none; }
  dialog input:focus { border-color: var(--red); }
  .drow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  #toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; display: flex; align-items: center; gap: 14px; max-width: calc(100vw - 32px); padding: 10px 18px; border-radius: 999px; background: var(--text); color: var(--bg); font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  #toast.err { background: var(--danger); }
  #toast button { padding: 0; border: 0; background: none; color: var(--red); font-weight: 700; cursor: pointer; }

  @media (max-width: 640px) {
    header { flex-wrap: wrap; gap: 10px; padding: 10px 16px; }
    .search { order: 3; flex-basis: 100%; max-width: none; }
    .search kbd { display: none; }
    .actions .btn span { display: none; }
    .actions .btn { width: 40px; padding: 0; }
    .bar { padding: 14px 16px 8px; }
    #crumbs { font-size: 17px; }
    main { padding: 4px 16px 16px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    #stats { padding: 0 16px 16px; }
    .vbar { padding: 8px 12px; }
    #vmeta, .vbar .btn span { display: none; }
    .vbar .btn { width: 40px; padding: 0; }
    #vbody { padding: 8px; }
    .nav { top: auto; bottom: 16px; transform: none; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="#/">911</a>
  <label class="search"><span id="iSearch"></span><input id="q" type="search" placeholder="Buscar em tudo" autocomplete="off"><kbd>/</kbd></label>
  <div class="actions">
    <button id="mkdir" class="btn"></button>
    <button id="send" class="btn primary"></button>
    <button id="trashBtn" class="btn icon" title="Lixeira" aria-label="Lixeira"></button>
    <form method="post" action="/logout"><button id="out" class="btn icon" title="Sair" aria-label="Sair"></button></form>
  </div>
</header>
<div class="bar">
  <nav id="crumbs"></nav>
  <select id="sort" aria-label="Ordenar">
    <option value="name">Nome</option>
    <option value="date">Mais recentes</option>
    <option value="size">Maiores</option>
  </select>
</div>
<main id="list"></main>
<footer id="stats"></footer>

<input type="file" id="pick" multiple hidden>
<input type="file" id="pickDir" webkitdirectory hidden>
<div id="drop"><div>Solte para enviar em <b id="dropTo"></b></div></div>
<div id="uploads" hidden></div>
<div id="viewer" hidden>
  <div class="vbar">
    <div class="vtitle"><div id="vname"></div><div id="vmeta"></div></div>
    <a id="vopen" class="btn" target="_blank" title="Abrir em outra aba"></a>
    <a id="vdl" class="btn" title="Baixar"></a>
    <button id="vclose" class="btn icon" title="Fechar (Esc)" aria-label="Fechar"></button>
  </div>
  <div class="vstage">
    <button class="nav prev" id="vprev" aria-label="Anterior"></button>
    <div id="vbody"></div>
    <button class="nav next" id="vnext" aria-label="Próximo"></button>
  </div>
</div>
<div id="menu" hidden></div>
<dialog id="dlg">
  <form method="dialog">
    <h3 id="dTitle"></h3>
    <p id="dText"></p>
    <input id="dInput" autocomplete="off" spellcheck="false">
    <div class="drow"><button class="btn small" value="">Cancelar</button><button class="btn small primary" id="dOk" value="ok"></button></div>
  </form>
</dialog>
<div id="toast"></div>

<script type="module">
const $ = s => document.querySelector(s)
const $$ = s => [...document.querySelectorAll(s)]
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`)
const enc = p => p.split("/").map(encodeURIComponent).join("/")
const join = (...a) => a.filter(Boolean).join("/")
const parent = p => p.split("/").slice(0, -1).join("/")
const base = p => p.split("/").pop()

// ---------- ícones ----------
const svg = d => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`
const I = {
  search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  upload: svg('<path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>'),
  folderPlus: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6m-3-3h6"/>'),
  folder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="currentColor" fill-opacity=".18"/>'),
  file: svg('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'),
  trash: svg('<path d="M4 7h16M10 11v6m4-6v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>'),
  logout: svg('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/>'),
  more: svg('<circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/>'),
  download: svg('<path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5"/><path d="M4 17v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1"/>'),
  close: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
  left: svg('<path d="m15 5-7 7 7 7"/>'),
  right: svg('<path d="m9 5 7 7-7 7"/>'),
  down: svg('<path d="m5 9 7 7 7-7"/>'),
  up: svg('<path d="m5 15 7-7 7 7"/>'),
  external: svg('<path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>'),
  restore: svg('<path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5"/>'),
  play: svg('<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>'),
  pencil: svg('<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/>'),
  move: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 13h6m-2-2 2 2-2 2"/>'),
  open: svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
}
$("#iSearch").outerHTML = I.search
$("#mkdir").innerHTML = I.folderPlus + "<span>Nova pasta</span>"
$("#send").innerHTML = I.upload + "<span>Enviar</span>"
$("#trashBtn").innerHTML = I.trash
$("#out").innerHTML = I.logout
$("#vopen").innerHTML = I.external + "<span>Abrir</span>"
$("#vdl").innerHTML = I.download + "<span>Baixar</span>"
$("#vclose").innerHTML = I.close
$("#vprev").innerHTML = I.left
$("#vnext").innerHTML = I.right

// ---------- tipos ----------
const KINDS = {
  image: "jpg jpeg png gif webp avif bmp svg heic",
  video: "mp4 webm mov m4v mkv ogv",
  audio: "mp3 wav ogg m4a flac aac opus",
  pdf: "pdf",
  doc: "doc docx odt rtf pages",
  sheet: "xls xlsx ods csv numbers",
  slide: "ppt pptx odp key",
  text: "txt md json log xml yml yaml ini conf html htm css js py sh",
  zip: "zip rar 7z tar gz tgz bz2 xz",
}
const KIND = {}
for (const k in KINDS) for (const x of KINDS[k].split(" ")) KIND[x] = k
const ext = n => n.includes(".") ? n.split(".").pop().toLowerCase() : ""
const kind = e => e.dir ? "dir" : KIND[ext(e.name)] || "other"
const label = e => esc(ext(e.name).slice(0, 4).toUpperCase() || "ARQ")
const raw = e => "/raw/" + enc(e.path)

const fmtSize = n => {
  let i = 0
  while (n >= 1024 && i < 4) { n /= 1024; i++ }
  return n.toLocaleString("pt-BR", { maximumFractionDigits: i ? 1 : 0 }) + " " + ["B", "KB", "MB", "GB", "TB"][i]
}
const fmtDate = t => new Date(t * 1000).toLocaleDateString("pt-BR")

// ---------- api ----------
async function api(url, opt) {
  const r = await fetch(url, opt)
  if (r.status == 401) { location = "/login"; throw new Error("login") }
  if (!r.ok) {
    let msg = await r.text()
    try { msg = JSON.parse(msg).detail } catch {}
    toast(msg || "erro " + r.status, { err: true })
    throw new Error(msg)
  }
  return r
}
const get = url => api(url).then(r => r.json())
const post = (url, body) => api(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(r => r.json())

// ---------- estado ----------
let cwd = ""          // pasta aberta ("" = início)
let mode = "dir"      // "dir" | "search" | "trash"
let items = []        // o que está na tela
let sort = "name"
try { sort = localStorage.getItem("911.sort") || "name" } catch {}
$("#sort").value = sort

const SORT = {
  name: (a, b) => a.name.localeCompare(b.name, "pt-BR", { numeric: true, sensitivity: "base" }),
  date: (a, b) => b.mtime - a.mtime,
  size: (a, b) => (b.size ?? 0) - (a.size ?? 0),
}
const sorted = () => [...items].sort((a, b) => (b.dir - a.dir) || SORT[sort](a, b) || SORT.name(a, b))

function route() {
  const h = decodeURIComponent(location.hash.slice(1))
  $("#q").value = ""
  closeViewer()
  if (h == "lixeira") return showTrash()
  cwd = h.replace(/^\/+|\/+$/g, "")
  load()
}

async function load() {
  try {
    items = await get("/api/list?path=" + encodeURIComponent(cwd))
  } catch {
    if (cwd) location.hash = "#/"
    return
  }
  mode = "dir"
  render()
}

async function search() {
  const q = $("#q").value.trim()
  if (!q) return mode == "search" ? load() : null
  items = await get("/api/search?q=" + encodeURIComponent(q))
  mode = "search"
  render()
}

const refresh = () => mode == "trash" ? showTrash() : mode == "search" ? search() : load()

async function loadStats() {
  const s = await get("/api/stats")
  $("#stats").textContent = `${fmtSize(s.used)} em ${s.files.toLocaleString("pt-BR")} ${s.files == 1 ? "arquivo" : "arquivos"} · ${fmtSize(s.free)} livres no disco`
    + (s.trash ? ` · ${fmtSize(s.trash)} na lixeira` : "")
}

// ---------- tela ----------
const io = new IntersectionObserver(list => {
  for (const x of list) if (x.isIntersecting) {
    const v = x.target
    io.unobserve(v)
    v.onloadeddata = () => v.parentNode.classList.add("has")
    v.onerror = () => v.remove()
    v.preload = "metadata"
    v.src = v.dataset.src
  }
}, { rootMargin: "300px" })

function crumbs() {
  if (mode == "search") return `<span class="cur">Busca</span><span class="count">${items.length}${items.length == 300 ? "+" : ""} ${items.length == 1 ? "resultado" : "resultados"}</span>`
  const parts = cwd ? cwd.split("/") : []
  let html = `<a href="#/" data-drop="">Início</a>`
  parts.forEach((p, i) => {
    const path = parts.slice(0, i + 1).join("/")
    html += `<span class="sep">/</span><a href="#/${enc(path)}" data-drop="${esc(path)}">${esc(p)}</a>`
  })
  return html
}

function thumb(e, k) {
  if (k == "dir") return I.folder
  const tag = `<span class="label">${label(e)}</span>`
  const v = `?v=${e.mtime}-${e.size}`
  const loaded = `onload="this.parentNode.classList.add('has')" onerror="this.remove()"`
  if (k == "image") return tag + `<img loading="lazy" draggable="false" alt="" src="${ext(e.name) == "svg" ? raw(e) : "/thumb/" + enc(e.path) + v}" ${loaded}>`
  if (k == "video") return tag + `<video muted playsinline preload="none" data-src="${raw(e)}#t=0.5"></video><span class="play">${I.play}</span>`
  return tag
}

function card(e, i) {
  const k = kind(e)
  const meta = e.dir ? `${e.n} ${e.n == 1 ? "item" : "itens"}` : `${fmtSize(e.size)} · ${fmtDate(e.mtime)}`
  const where = mode == "search" ? `<div class="meta">em ${esc(parent(e.path) || "Início")}</div>` : ""
  return `<div class="card k-${k}" data-i="${i}" draggable="true" tabindex="0" ${e.dir ? `data-drop="${esc(e.path)}"` : ""}>
    <div class="thumb">${thumb(e, k)}</div>
    <div class="info"><div class="name" title="${esc(e.name)}">${esc(e.name)}</div><div class="meta">${meta}</div>${where}</div>
    <button class="more" aria-label="Ações">${I.more}</button>
  </div>`
}

function render() {
  io.disconnect()
  items = sorted()
  $("#crumbs").innerHTML = crumbs()
  $("#trashBtn").classList.toggle("on", mode == "trash")
  $("#sort").hidden = false
  document.title = (mode == "search" ? "Busca" : cwd ? base(cwd) : "Início") + " · 911"
  if (!items.length) {
    $("#list").innerHTML = mode == "search"
      ? `<div class="empty">${I.search}<b>Nada encontrado</b>Nenhum nome tem “${esc($("#q").value.trim())}”.</div>`
      : `<div class="empty">${I.upload}<b>Pasta vazia</b>Arraste arquivos para cá ou use Enviar.</div>`
    return
  }
  $("#list").innerHTML = `<div class="grid">${items.map(card).join("")}</div>`
  $$("video[data-src]").forEach(v => io.observe(v))
}

async function showTrash() {
  const t = await get("/api/trash")
  mode = "trash"
  items = []
  document.title = "Lixeira · 911"
  $("#trashBtn").classList.add("on")
  $("#sort").hidden = true
  $("#crumbs").innerHTML = `<a href="#/">Início</a><span class="sep">/</span><span class="cur">Lixeira</span>`
    + (t.length ? `<button class="btn small push" id="empty">${I.trash}Esvaziar lixeira</button>` : "")
  if (!t.length) {
    $("#list").innerHTML = `<div class="empty">${I.trash}<b>A lixeira está vazia</b>O que você apagar fica aqui até esvaziar.</div>`
    return
  }
  $("#list").innerHTML = `<div class="rows">${t.map(x => {
    const e = { name: base(x.path), dir: x.dir }
    return `<div class="row k-${kind(e)}">
      <div class="tile">${x.dir ? I.folder : label(e)}</div>
      <div class="txt"><div class="name">${esc(e.name)}</div>
        <div class="meta">de ${esc(parent(x.path) || "Início")} · ${fmtSize(x.size)} · apagado em ${fmtDate(x.when)}</div></div>
      <button class="btn small" data-restore="${x.id}">${I.restore}<span>Restaurar</span></button>
      <button class="btn small icon" data-purge="${x.id}" title="Apagar de vez" aria-label="Apagar de vez">${I.close}</button>
    </div>`
  }).join("")}</div>`
  $("#empty").onclick = async () => {
    if (!await confirmBox("Esvaziar a lixeira?", `${t.length} ${t.length == 1 ? "item será apagado" : "itens serão apagados"} para sempre.`, "Esvaziar")) return
    await post("/api/trash", { action: "empty" })
    showTrash(); loadStats()
  }
}

// ---------- ações ----------
async function move(e, to) {
  if (to == e.path) return
  await post("/api/fs", { action: "mv", path: e.path, to })
  toast(`Movido para ${parent(to) || "Início"}`)
  refresh()
}

async function rename(e) {
  const name = await ask("Renomear", "", e.name, "Renomear")
  if (!name || name == e.name) return
  if (name.includes("/")) return toast("O nome não pode ter /", { err: true })
  await post("/api/fs", { action: "mv", path: e.path, to: join(parent(e.path), name) })
  refresh()
}

async function moveTo(e) {
  const to = await ask("Mover para…", "Pasta de destino (vazio = Início). Pastas que não existem são criadas.", parent(e.path), "Mover")
  if (to == null) return
  await move(e, join(to.replace(/^\/+|\/+$/g, ""), e.name))
}

async function remove(e) {
  if (!await confirmBox("Mover para a lixeira?", e.name, "Apagar")) return
  const { id } = await post("/api/fs", { action: "rm", path: e.path })
  toast(`“${e.name}” foi para a lixeira`, { action: "Desfazer", run: async () => {
    await post("/api/trash", { action: "restore", id })
    refresh(); loadStats()
  } })
  refresh(); loadStats()
}

function open(e) {
  if (e.dir) location.hash = "#/" + enc(e.path)
  else viewer(e)
}

const download = e => { const a = document.createElement("a"); a.href = raw(e) + "?dl=1"; a.click() }

function actions(e) {
  return [
    [I.open, "Abrir", () => open(e)],
    ...e.dir ? [] : [[I.download, "Baixar", () => download(e)]],
    [I.pencil, "Renomear", () => rename(e)],
    [I.move, "Mover para…", () => moveTo(e)],
    "-",
    [I.trash, "Apagar", () => remove(e), "danger"],
  ]
}

$("#mkdir").onclick = async () => {
  const name = await ask("Nova pasta", cwd ? `Dentro de ${cwd}` : "", "", "Criar")
  if (!name) return
  await post("/api/fs", { action: "mkdir", path: join(mode == "dir" ? cwd : "", name) })
  if (mode == "dir") load()
}

$("#send").onclick = ev => {
  const r = ev.currentTarget.getBoundingClientRect()
  menu([[I.file, "Arquivos", () => $("#pick").click()], [I.folder, "Pasta inteira", () => $("#pickDir").click()]], r.right, r.bottom + 6, true)
}
$("#pick").onchange = ev => { enqueue([...ev.target.files].map(f => ({ file: f, rel: f.name })), target()); ev.target.value = "" }
$("#pickDir").onchange = ev => { enqueue([...ev.target.files].map(f => ({ file: f, rel: f.webkitRelativePath || f.name })), target()); ev.target.value = "" }
const target = () => mode == "dir" ? cwd : ""

$("#trashBtn").onclick = () => location.hash = mode == "trash" ? "#/" + enc(cwd) : "#lixeira"
$("#sort").onchange = ev => {
  sort = ev.target.value
  try { localStorage.setItem("911.sort", sort) } catch {}
  render()
}

let searchTimer
$("#q").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, 250) }

// cliques na lista (cartões e lixeira)
const itemOf = el => items[el.closest(".card")?.dataset.i]
$("#list").addEventListener("click", async ev => {
  const restore = ev.target.closest("[data-restore]"), purge = ev.target.closest("[data-purge]")
  if (restore) {
    const { path } = await post("/api/trash", { action: "restore", id: restore.dataset.restore })
    toast(`Restaurado em ${parent(path) || "Início"}`)
    return showTrash().then(loadStats)
  }
  if (purge) {
    if (!await confirmBox("Apagar de vez?", "Não tem como desfazer.", "Apagar")) return
    await post("/api/trash", { action: "purge", id: purge.dataset.purge })
    return showTrash().then(loadStats)
  }
  const e = itemOf(ev.target)
  if (!e) return
  const more = ev.target.closest(".more")
  if (more) {
    const r = more.getBoundingClientRect()
    return menu(actions(e), r.right, r.bottom + 6, true)
  }
  open(e)
})
$("#list").addEventListener("contextmenu", ev => {
  const e = itemOf(ev.target)
  if (!e) return
  ev.preventDefault()
  menu(actions(e), ev.clientX, ev.clientY)
})
$("#list").addEventListener("keydown", ev => {
  const e = itemOf(ev.target)
  if (!e || ev.target.closest(".more")) return
  if (ev.key == "Enter") open(e)
  else if (ev.key == "F2") rename(e)
  else if (ev.key == "Delete") remove(e)
  else return
  ev.preventDefault()
})

// ---------- arrastar: cartão pra pasta (mover) e arquivos de fora (enviar) ----------
let dragging = null, dropTimer
$("#list").addEventListener("dragstart", ev => {
  dragging = itemOf(ev.target)
  if (!dragging) return
  ev.dataTransfer.effectAllowed = "move"
  ev.dataTransfer.setData("text/plain", dragging.name)
})
document.addEventListener("dragend", () => { dragging = null; clearOver() })
const clearOver = () => $$(".over").forEach(x => x.classList.remove("over"))
const dropEl = ev => ev.target.closest?.("[data-drop]")
const canMoveInto = (e, dir) => dir != parent(e.path) && dir != e.path && !dir.startsWith(e.path + "/")

document.addEventListener("dragover", ev => {
  const el = dropEl(ev), dir = el?.dataset.drop
  clearOver()
  if (dragging) {
    if (el && canMoveInto(dragging, dir)) { ev.preventDefault(); el.classList.add("over") }
    return
  }
  if (!ev.dataTransfer.types.includes("Files")) return
  ev.preventDefault()  // sem isso o navegador abre o arquivo e sai do 911
  el?.classList.add("over")
  $("#dropTo").textContent = (el ? dir : target()) || "Início"
  $("#drop").classList.add("on")
  clearTimeout(dropTimer)
  dropTimer = setTimeout(() => { $("#drop").classList.remove("on"); clearOver() }, 150)
})

document.addEventListener("drop", ev => {
  const el = dropEl(ev), dir = el?.dataset.drop
  $("#drop").classList.remove("on")
  clearOver()
  if (dragging) {
    ev.preventDefault()
    if (el && canMoveInto(dragging, dir)) move(dragging, join(dir, dragging.name))
    return
  }
  if (!ev.dataTransfer.types.includes("Files")) return
  ev.preventDefault()
  const to = el ? dir : target()
  collect(ev.dataTransfer).then(files => enqueue(files, to))
})

// pastas arrastadas: percorre tudo mantendo a estrutura
function collect(dt) {
  const entries = [...dt.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean)  // precisa ser síncrono, dentro do evento
  if (!entries.length) return Promise.resolve([...dt.files].map(f => ({ file: f, rel: f.name })))
  return Promise.all(entries.map(en => walk(en, ""))).then(a => a.flat())
}
async function walk(en, prefix) {
  const rel = join(prefix, en.name)
  if (en.isFile) return [{ file: await new Promise((ok, no) => en.file(ok, no)), rel }]
  const reader = en.createReader(), out = []
  for (;;) {
    const batch = await new Promise((ok, no) => reader.readEntries(ok, no))
    if (!batch.length) return out
    for (const c of batch) out.push(...await walk(c, rel))
  }
}

// ---------- fila de envio (um por vez, pra não sufocar o servidor) ----------
const queue = []
let busy = false, uFrame = 0, refreshTimer

function enqueue(files, dir) {
  // o servidor recusa nomes começando com "." (.DS_Store, .git...), então nem tenta
  files = files.filter(f => !f.rel.split("/").some(s => s.startsWith(".")))
  if (!files.length) return
  for (const f of files) queue.push({ ...f, dir, done: 0, state: "wait" })
  $("#uploads").classList.remove("min")
  drawUploads()
  pump()
}

async function pump() {
  if (busy) return
  busy = true
  let u
  while ((u = queue.find(x => x.state == "wait"))) await send(u)
  busy = false
  drawUploads()
  loadStats()
  const failed = queue.filter(x => x.state == "err").length
  if (!failed) setTimeout(() => { if (!busy) { queue.length = 0; drawUploads() } }, 3000)
}

function send(u) {
  return new Promise(done => {
    const x = u.xhr = new XMLHttpRequest()
    u.state = "up"
    x.open("PUT", "/api/upload?path=" + encodeURIComponent(join(u.dir, u.rel)))
    x.setRequestHeader("X-Mtime", u.file.lastModified / 1000)
    x.upload.onprogress = ev => { u.done = ev.loaded / ev.total; drawUploads() }
    x.onload = () => {
      if (x.status == 401) location = "/login"
      u.state = x.status < 300 ? "ok" : "err"
      if (u.state == "err") try { u.msg = JSON.parse(x.responseText).detail } catch { u.msg = "erro " + x.status }
      clearTimeout(refreshTimer)
      if (mode == "dir") refreshTimer = setTimeout(load, 400)
      done()
    }
    x.onerror = () => { u.state = "err"; u.msg = "falhou a conexão"; done() }
    x.onabort = () => { u.state = "cancel"; done() }
    x.send(u.file)
  })
}

function drawUploads() {
  if (uFrame) return
  uFrame = requestAnimationFrame(() => {
    uFrame = 0
    const box = $("#uploads")
    box.hidden = !queue.length
    if (!queue.length) return
    const total = queue.reduce((s, u) => s + u.file.size, 0) || 1
    const sent = queue.reduce((s, u) => s + u.file.size * (u.state == "ok" ? 1 : u.state == "up" ? u.done : 0), 0)
    const ok = queue.filter(u => u.state == "ok").length
    const left = queue.filter(u => u.state == "wait" || u.state == "up").length
    const errs = queue.filter(u => u.state == "err").length
    const head = left ? `Enviando ${ok + 1} de ${ok + left}` : errs ? `${errs} ${errs == 1 ? "falhou" : "falharam"}` : `${ok} ${ok == 1 ? "enviado" : "enviados"}`
    // os que importam primeiro: enviando, erros, esperando, prontos
    const order = { up: 0, err: 1, wait: 2, ok: 3, cancel: 4 }
    const shown = [...queue].sort((a, b) => order[a.state] - order[b.state]).slice(0, 40)
    box.innerHTML = `<div class="uhead"><span>${head}</span>
        <button id="uMin" title="Minimizar">${box.classList.contains("min") ? I.up : I.down}</button>
        <button id="uX" title="${left ? "Cancelar tudo" : "Fechar"}">${I.close}</button></div>
      <div class="ubar"><i style="width:${(sent / total * 100).toFixed(1)}%"></i></div>
      <div class="ulist">${shown.map(u => `<div class="uitem ${u.state}" data-q="${queue.indexOf(u)}">
        <span class="n" title="${esc(u.rel)}">${esc(u.rel)}</span>
        <span class="s">${u.state == "up" ? Math.round(u.done * 100) + "%" : u.state == "ok" ? "✓" : u.state == "err" ? esc(u.msg) : u.state == "cancel" ? "cancelado" : fmtSize(u.file.size)}</span>
        ${u.state == "up" || u.state == "wait" ? `<button title="Cancelar">${I.close}</button>` : ""}
      </div>`).join("")}</div>
      ${queue.length > shown.length ? `<div class="umore">e mais ${queue.length - shown.length}</div>` : ""}`
  })
}
$("#uploads").addEventListener("click", ev => {
  if (ev.target.closest("#uMin")) { $("#uploads").classList.toggle("min"); return drawUploads() }
  if (ev.target.closest("#uX")) {
    for (const u of queue) if (u.state == "wait") u.state = "cancel"
    queue.find(u => u.state == "up")?.xhr.abort()
    if (!busy) { queue.length = 0; drawUploads() }
    return
  }
  const row = ev.target.closest("button") && ev.target.closest("[data-q]")
  if (!row) return
  const u = queue[row.dataset.q]
  if (u.state == "up") u.xhr.abort()
  else u.state = "cancel"
  drawUploads()
})
addEventListener("beforeunload", ev => { if (busy) ev.preventDefault() })

// ---------- visualizador ----------
let vlist = [], vi = 0
function viewer(e) {
  vlist = items.filter(x => !x.dir)
  vi = vlist.findIndex(x => x.path == e.path)
  showFile()
}
function showFile() {
  const e = vlist[vi], k = kind(e), src = raw(e), body = $("#vbody")
  $("#vname").textContent = e.name
  $("#vmeta").textContent = `${fmtSize(e.size)} · ${fmtDate(e.mtime)}` + (mode == "search" ? ` · em ${parent(e.path) || "Início"}` : "")
  $("#vopen").href = src
  $("#vdl").href = src + "?dl=1"
  $("#vprev").disabled = vi == 0
  $("#vnext").disabled = vi == vlist.length - 1
  const fallback = msg => body.innerHTML = `<div class="fallback k-${k}"><div class="tile">${label(e)}</div><p>${msg}</p>
    <a class="btn primary" href="${src}?dl=1">${I.download}Baixar</a></div>`
  if (k == "image") body.innerHTML = `<img alt="" src="${src}">`
  else if (k == "video") body.innerHTML = `<video controls autoplay playsinline src="${src}"></video>`
  else if (k == "audio") body.innerHTML = `<audio controls autoplay src="${src}"></audio>`
  else if (k == "pdf") body.innerHTML = `<iframe src="${src}" title="${esc(e.name)}"></iframe>`
  else if (k == "text" || ext(e.name) == "csv") {
    body.innerHTML = "<pre></pre>"
    const limit = 512 * 1024  // texto gigante: mostra o começo
    const show = t => { if (vlist[vi] == e) body.querySelector("pre").textContent = t }
    if (!e.size) show("(arquivo vazio)")
    else fetch(src, { headers: { Range: `bytes=0-${limit - 1}` } }).then(r => r.text())
      .then(t => show(t + (e.size > limit ? "\n\n… (arquivo grande: baixe para ver tudo)" : "")))
  }
  else fallback("Sem pré-visualização para esse tipo.")
  body.querySelector("img, video, audio")?.addEventListener("error", () => fallback("O navegador não conseguiu abrir esse arquivo."))
  $("#viewer").hidden = false
}
function closeViewer() {
  $("#viewer").hidden = true
  $("#vbody").innerHTML = ""  // para vídeo/áudio
}
const step = d => { if (vlist[vi + d]) { vi += d; showFile() } }
$("#vclose").onclick = closeViewer
$("#vprev").onclick = () => step(-1)
$("#vnext").onclick = () => step(1)

// ---------- menu ----------
function menu(acts, x, y, alignRight) {
  const m = $("#menu")
  m.innerHTML = acts.map((a, i) => a == "-" ? "<hr>" : `<button data-a="${i}" class="${a[3] || ""}">${a[0]}${a[1]}</button>`).join("")
  m.hidden = false
  const w = m.offsetWidth, h = m.offsetHeight
  m.style.left = Math.max(8, Math.min((alignRight ? x - w : x), innerWidth - w - 8)) + "px"
  m.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + "px"
  m.onclick = ev => {
    const b = ev.target.closest("[data-a]")
    if (!b) return
    m.hidden = true
    acts[b.dataset.a][2]()
  }
  m.querySelector("button").focus()
}
document.addEventListener("click", ev => {
  if (!ev.target.closest("#menu, .more, #send")) $("#menu").hidden = true
})

// ---------- diálogo e aviso ----------
function dialog(title, text, value, ok, danger) {
  const d = $("#dlg"), input = $("#dInput")
  $("#dTitle").textContent = title
  $("#dText").textContent = text
  $("#dText").hidden = !text
  $("#dOk").textContent = ok
  $("#dOk").className = "btn small " + (danger ? "danger" : "primary")
  input.hidden = value == null
  input.value = value ?? ""
  d.returnValue = ""
  d.showModal()
  if (value != null) {
    input.focus()
    const dot = value.lastIndexOf(".")
    input.setSelectionRange(0, dot > 0 ? dot : value.length)  // renomear: seleciona sem a extensão
  } else $("#dOk").focus()
  return new Promise(ok => d.addEventListener("close", () => ok(d.returnValue == "ok" ? input.value.trim() : null), { once: true }))
}
const ask = (title, text, value, ok) => dialog(title, text, value, ok)
const confirmBox = (title, text, ok) => dialog(title, text, null, ok, true).then(v => v != null)
$("#dInput").addEventListener("keydown", ev => { if (ev.key == "Enter") { ev.preventDefault(); $("#dlg").close("ok") } })

let toastTimer
function toast(msg, { err, action, run } = {}) {
  const t = $("#toast")
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action)}</button>` : "")
  t.className = "show" + (err ? " err" : "")
  if (action) t.querySelector("button").onclick = () => { t.className = ""; run() }
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.className = "", action ? 6000 : 3500)
}

// ---------- teclado ----------
addEventListener("keydown", ev => {
  if ($("#dlg").open) return
  const typing = ev.target.matches("input, textarea, select")
  if (!$("#viewer").hidden) {
    if (ev.key == "Escape") closeViewer()
    else if (ev.target.matches("video, audio")) return
    else if (ev.key == "ArrowLeft") step(-1)
    else if (ev.key == "ArrowRight") step(1)
    return
  }
  if (ev.key == "Escape") {
    if (!$("#menu").hidden) $("#menu").hidden = true
    else if ($("#q").value) { $("#q").value = ""; $("#q").blur(); search() }
  } else if (ev.key == "/" && !typing) {
    ev.preventDefault()
    $("#q").focus()
  }
})

addEventListener("hashchange", route)
$(".brand").onclick = () => { if (location.hash == "#/") route() }  // mesmo hash não dispara hashchange
route()
loadStats()
</script>
