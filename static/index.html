<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0E10">
<title>911</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E0E10'/%3E%3Ctext x='16' y='21' font-family='monospace' font-weight='700' font-size='13' text-anchor='middle' fill='%23FF4D2E'%3E911%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/Archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/JetBrainsMono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#energy">911</a>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span class="sr">Search</span>
      <input id="q" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
      <kbd id="kbd">Ctrl + F</kbd>
    </label>
    <div class="seg" role="tablist" aria-label="Section">
      <button role="tab" data-tab="energy" aria-selected="true">Energy</button>
      <button role="tab" data-tab="docs" aria-selected="false">Documents</button>
    </div>
    <button class="up" id="up" aria-label="Upload"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>Upload</span></button>
  </header>
  <div id="jobs"></div>
  <main id="list"></main>
  <footer class="foot">
    <span id="stats"></span>
    <button id="trashBtn" class="link">Trash</button>
    <form method="post" action="/logout"><button class="link">Log out</button></form>
  </footer>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grip"></div>
    <div class="phead"><h2 id="sheetTitle"></h2><button class="x" data-close aria-label="Close"></button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="viewer" hidden>
  <div class="vbar">
    <button class="ib" id="vclose" aria-label="Back"></button>
    <div class="vtitle"><div id="vname"></div><div id="vmeta"></div></div>
    <a class="ib" id="vdl" aria-label="Download" title="Download"></a>
    <button class="ib" id="vlab" aria-label="Label" title="Label (shown instead of the file name)"></button>
    <button class="ib" id="vren" aria-label="Rename" title="Rename"></button>
    <button class="ib" id="vdel" aria-label="Delete" title="Delete"></button>
  </div>
  <div id="tools" hidden></div>
  <div class="vstage">
    <button class="nav prev" id="vprev" aria-label="Previous"></button>
    <div id="vbody"></div>
    <button class="nav next" id="vnext" aria-label="Next"></button>
  </div>
</div>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dTitle"></h3>
    <p id="dText"></p>
    <label class="field" id="dField"><span class="sr">Name</span><input id="dInput" autocomplete="off" spellcheck="false"></label>
    <div class="drow"><button class="ghost" value="">Cancel</button><button class="go" id="dOk" value="ok"></button></div>
  </form>
</dialog>
<div id="selbar" role="toolbar" aria-label="Selected files" hidden></div>
<div id="menu" role="menu" hidden></div>
<div id="toast" role="status"></div>
<div id="uploads" hidden></div>
<div id="drop"><div>Drop to add to <span id="dropTo"></span></div></div>
<input type="file" id="pick" multiple hidden>
</body>
</html>
