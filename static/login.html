<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0E10">
<title>911</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E0E10'/%3E%3Ctext x='16' y='21' font-family='monospace' font-weight='700' font-size='13' text-anchor='middle' fill='%23FF4D2E'%3E911%3C/text%3E%3C/svg%3E">
<style>
  @font-face { font-family: Archivo; src: url(/static/fonts/Archivo.woff2) format("woff2"); font-weight: 400 800; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url(/static/fonts/JetBrainsMono.woff2) format("woff2"); font-weight: 500 700; font-display: swap; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #0E0E10; color: #F4F1EA; font: 15px/1.4 Archivo, system-ui, sans-serif; }
  form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
  .logo { margin-bottom: 12px; font: 700 72px/0.9 "JetBrains Mono", ui-monospace, monospace; letter-spacing: -3px; color: #FF4D2E; }
  label { display: flex; align-items: center; height: 48px; padding: 0 14px; border-radius: 14px; background: #18181B; border: 1px solid #27272A; }
  label:focus-within { border-color: #FF4D2E; }
  input { flex: 1; min-width: 0; background: transparent; border: 0; color: inherit; font: inherit; outline: none; }
  button { height: 48px; border: 0; border-radius: 14px; background: #FF4D2E; color: #0E0E10; font: 800 15px Archivo, system-ui, sans-serif; cursor: pointer; }
  p { margin: 0; min-height: 1.4em; color: #FF4D2E; font-size: 14px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="logo">911</div>
  <label><span class="sr">Password</span><input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required></label>
  <button>Log in</button>
  <p id="err" role="alert"></p>
</form>
<script>
  const q = new URLSearchParams(location.search)
  if (q.has("wrong")) err.textContent = "Wrong password."
  if (q.has("blocked")) err.textContent = `Too many attempts. Try again in ${q.get("blocked")} min.`
</script>
</body>
</html>
