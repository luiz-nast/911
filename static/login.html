<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>911</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d5001c'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-weight='800' font-size='15' text-anchor='middle' fill='white'%3E911%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --bg: #0c0c0d; --bg2: #161618; --line: #2a2a2e; --text: #ececee; --muted: #8b8b93; --red: #d5001c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: 100%; max-width: 340px; display: grid; gap: 14px; }
  h1 { margin: 0 0 6px; font-size: 56px; font-weight: 800; letter-spacing: .12em; line-height: 1; }
  h1 span { display: block; margin-top: 10px; width: 48px; height: 4px; border-radius: 2px; background: var(--red); }
  input, button { font: inherit; border-radius: 10px; padding: 12px 14px; }
  input { background: var(--bg2); color: inherit; border: 1px solid var(--line); outline: none; }
  input:focus { border-color: var(--red); }
  button { background: var(--red); color: white; border: 0; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.12); }
  p { margin: 0; min-height: 1.5em; color: #ff6b7a; font-size: 14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>911<span></span></h1>
  <input type="password" name="password" placeholder="Senha" autocomplete="current-password" autofocus required>
  <button>Entrar</button>
  <p id="erro"></p>
</form>
<script>
  const q = new URLSearchParams(location.search)
  if (q.has("erro")) erro.textContent = "Senha errada."
  if (q.has("bloqueado")) erro.textContent = `Muitas tentativas. Tente de novo em ${q.get("bloqueado")} min.`
</script>
</body>
</html>
